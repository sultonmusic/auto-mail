<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auto Mail</title>
<meta name="description" content="Gmail'ga kelgan xatlar avtomatik navbatga olinadi, admin panelda ko'riladi va javob beriladi.">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./logo.png" type="image/png">
<link rel="apple-touch-icon" href="./logo.png">
<link rel="stylesheet" href="./style.css">
</head>
<body data-view="list">

<header class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" data-i18n-title="menu.open" aria-label="Menu">☰</button>
  <button class="icon-btn back-btn" id="backBtn" data-i18n-title="top.back" aria-label="Back">‹</button>
  <div class="brand">
    <img src="./logo.png" alt="" width="28" height="28" class="brand-logo">
    <div>
      <strong id="brandLabel">Capline Group</strong>
      <span class="account" id="accountLabel"></span>
    </div>
  </div>
  <div class="top-actions">
    <label class="lang-picker" data-i18n-title="top.lang">
      <span aria-hidden="true">🌐</span>
      <select id="langSelect" aria-label="Language"></select>
    </label>
    <span class="status" id="statusPill" data-state="off"></span>
    <button class="icon-btn" id="autoReplyBtn" data-i18n-title="top.autoReply" aria-label="Auto reply">🤖</button>
    <button class="icon-btn" id="notifyBtn" data-i18n-title="top.notify" aria-label="Notifications">🔔</button>
    <button class="icon-btn" id="composeBtn" data-i18n-title="top.newMail" aria-label="New">✎</button>
    <button class="icon-btn" id="refreshBtn" data-i18n-title="top.refresh" aria-label="Refresh">⟳</button>
    <button class="icon-btn" id="themeBtn" data-i18n-title="top.theme" aria-label="Theme">◐</button>
    <button class="icon-btn" id="settingsBtn" data-i18n-title="top.settings" aria-label="Settings">⚙</button>
  </div>
</header>

<div class="scrim" id="scrim" hidden></div>

<main class="layout">
  <nav class="panel side-panel" id="sidePanel" aria-label="Mailboxes">
    <div class="side-scroll">
      <h3 class="side-title" data-i18n="menu.mailboxes"></h3>
      <ul class="box-list" id="boxList"></ul>
      <h3 class="side-title" data-i18n="menu.categories"></h3>
      <ul class="box-list" id="categoryList"></ul>
      <h3 class="side-title" data-i18n="menu.ai"></h3>
      <ul class="box-list" id="aiList"></ul>
      <h3 class="side-title" data-i18n="menu.labels"></h3>
      <ul class="box-list" id="labelList"></ul>
      <button class="add-account" id="addAccountBtn" data-i18n="menu.addAccount"></button>
    </div>
  </nav>

  <section class="panel list-panel">
    <div class="list-head">
      <div class="notice urgent" id="signInNotice" hidden>
        <span data-i18n="banner.signedOut"></span>
        <button type="button" id="bannerSignIn" data-i18n="banner.signIn"></button>
      </div>
      <div class="notice" id="autoReplyNotice" hidden>
        <span data-i18n="banner.autoReplyOff"></span>
        <button type="button" id="enableAutoReply" data-i18n="banner.enable"></button>
      </div>
      <button class="new-chat" id="newChatBtn" data-i18n="list.newChat"></button>
      <div class="box-header"><span class="box-icon" id="boxIcon"></span><strong id="boxTitle"></strong></div>
      <input type="search" id="searchInput" data-i18n-ph="list.search" autocomplete="off">
      <nav class="tabs" id="tabs">
        <button data-status="new" class="active"><span data-i18n="tab.new"></span> <span class="count" data-count="new">0</span></button>
        <button data-status="progress"><span data-i18n="tab.progress"></span> <span class="count" data-count="progress">0</span></button>
        <button data-status="done"><span data-i18n="tab.done"></span> <span class="count" data-count="done">0</span></button>
        <button data-status="all"><span data-i18n="tab.all"></span> <span class="count" data-count="all">0</span></button>
      </nav>
    </div>
    <ul class="ticket-list" id="ticketList"></ul>
    <p class="empty" id="listEmpty" data-i18n="list.empty" hidden></p>
  </section>

  <section class="panel detail-panel" id="detailPanel">
    <div class="detail-empty" id="detailEmpty">
      <img src="./logo.png" alt="" width="64" height="64" class="brand-logo">
      <h2 data-i18n="detail.emptyTitle"></h2>
      <p data-i18n="detail.emptyText"></p>
      <button class="primary" id="signInBtn" data-i18n="detail.signIn" hidden></button>
    </div>

    <article class="detail" id="detail" hidden>
      <div class="detail-head">
        <h2 id="dSubject"></h2>
        <div class="meta">
          <span id="dFrom"></span>
          <time id="dDate"></time>
          <span class="ai-badge" id="aiBadge" hidden></span>
          <span class="ai-badge" id="autoBadge" hidden></span>
        </div>
        <div class="status-row" id="statusRow">
          <button data-set="new" data-i18n="detail.setNew"></button>
          <button data-set="progress" data-i18n="detail.setProgress"></button>
          <button data-set="done" data-i18n="detail.setDone"></button>
          <button class="ghost" id="cardReplyBtn" data-i18n="detail.cardReply"></button>
          <button class="ghost" id="queueBtn" data-i18n="browse.addToQueue" hidden></button>
          <button class="ghost" id="openGmail" data-i18n="detail.openGmail"></button>
        </div>
      </div>

      <div class="body-wrap" id="bodyWrap"></div>

      <label class="note-label" data-i18n="note.label">
        <textarea id="noteInput" rows="2" data-i18n-ph="note.ph"></textarea>
      </label>

      <div class="composer">
        <div class="composer-head">
          <strong data-i18n="composer.title"></strong>
          <select id="templateSelect"></select>
          <button class="ghost small" id="saveTemplate" data-i18n="composer.saveTemplate"></button>
        </div>
        <textarea id="replyInput" rows="6" data-i18n-ph="composer.replyPh"></textarea>
        <div class="composer-foot">
          <label class="chk"><input type="checkbox" id="markReadAfter" checked> <span data-i18n="composer.markRead"></span></label>
          <button class="primary" id="sendBtn" data-i18n="composer.send"></button>
        </div>
      </div>
    </article>
  </section>
</main>

<dialog id="setupDialog" class="sheet">
  <form method="dialog" class="sheet-body">
    <h2 data-i18n="settings.title"></h2>
    <p class="hint" data-i18n="settings.hint"></p>

    <label data-i18n="settings.lang">
      <select id="langSelectSettings"></select>
    </label>

    <button type="button" class="ghost" id="switchAccountBtn" data-i18n="settings.switchAccount"></button>

    <label data-i18n="settings.clientId">
      <input type="text" id="clientIdInput" placeholder="1234567890-abc.apps.googleusercontent.com" spellcheck="false">
    </label>

    <label data-i18n="settings.query">
      <input type="text" id="queryInput" placeholder="in:inbox -from:me newer_than:7d" spellcheck="false">
    </label>

    <div class="grid-2">
      <label data-i18n="settings.poll">
        <input type="number" id="pollInput" min="10" max="3600" step="5">
      </label>
      <label class="chk-block">
        <input type="checkbox" id="notifyInput"> <span data-i18n="settings.notify"></span>
      </label>
    </div>

    <label data-i18n="settings.signature">
      <textarea id="signatureInput" rows="3"></textarea>
    </label>

    <details class="howto">
      <summary data-i18n="settings.howto"></summary>
      <ol>
        <li data-i18n="settings.step1"></li>
        <li data-i18n="settings.step2"></li>
        <li data-i18n="settings.step3"></li>
        <li data-i18n="settings.step4"></li>
        <li><span data-i18n="settings.step5"></span> <code id="originHint"></code></li>
      </ol>
    </details>

    <hr class="sep">
    <h3 data-i18n="settings.autoSection"></h3>
    <label class="chk-block">
      <input type="checkbox" id="autoReplyInput"> <span data-i18n="settings.autoEnable"></span>
    </label>
    <p class="hint" data-i18n="settings.autoHint"></p>

    <label data-i18n="settings.cardLang">
      <select id="cardLangInput"></select>
    </label>

    <label data-i18n="settings.senderName">
      <input type="text" id="senderNameInput" placeholder="Founder Capline Group">
    </label>

    <label data-i18n="settings.logoUrl">
      <input type="text" id="logoUrlInput" placeholder="https://sultonmusic.github.io/auto-mail/logo.png" spellcheck="false">
    </label>
    <p class="hint" data-i18n="settings.logoHint"></p>

    <div class="grid-2">
      <label data-i18n="settings.brandName">
        <input type="text" id="brandNameInput" placeholder="Capline Group">
      </label>
      <label data-i18n="settings.brandColor">
        <input type="color" id="brandColorInput">
      </label>
    </div>

    <label data-i18n="settings.cardTitle">
      <input type="text" id="autoTitleInput">
    </label>

    <label data-i18n="settings.cardText">
      <textarea id="autoTextInput" rows="3"></textarea>
    </label>

    <label data-i18n="settings.cardSteps">
      <textarea id="autoStepsInput" rows="3"></textarea>
    </label>

    <div class="grid-2">
      <label data-i18n="settings.cardUrl">
        <input type="text" id="autoUrlInput" placeholder="https://example.com" spellcheck="false">
      </label>
      <label data-i18n="settings.cardButton">
        <input type="text" id="autoButtonInput">
      </label>
    </div>

    <label data-i18n="settings.cardContact">
      <input type="text" id="autoContactInput" placeholder="info@example.com" spellcheck="false">
    </label>

    <label data-i18n="settings.responseTime">
      <input type="text" id="responseTimeInput" spellcheck="false">
    </label>

    <p class="hint"><span data-i18n="settings.placeholders"></span>
      <code>{name}</code> <code>{subject}</code> <code>{ticket}</code> <code>{date}</code></p>

    <div class="btn-row">
      <button type="button" class="ghost" id="loadDefaultsBtn" data-i18n="settings.loadDefaults"></button>
      <button type="button" class="ghost" id="previewBtn" data-i18n="settings.preview"></button>
      <button type="button" class="ghost" id="clearQueueBtn" data-i18n="settings.clearQueue"></button>
    </div>

    <div class="sheet-foot">
      <button value="cancel" class="ghost" data-i18n="btn.cancel"></button>
      <button value="save" class="primary" id="saveSettings" data-i18n="btn.save"></button>
    </div>
  </form>
</dialog>

<dialog id="composeDialog" class="sheet">
  <form method="dialog" class="sheet-body">
    <h2 data-i18n="compose.title"></h2>
    <label data-i18n="compose.to">
      <input type="text" id="composeTo" placeholder="name@example.com" spellcheck="false" autocomplete="off">
    </label>
    <label data-i18n="compose.subject">
      <input type="text" id="composeSubject">
    </label>
    <label data-i18n="compose.body">
      <textarea id="composeBody" rows="7" data-i18n-ph="compose.bodyPh"></textarea>
    </label>
    <label class="chk-block">
      <input type="checkbox" id="composeCard"> <span data-i18n="compose.asCard"></span>
    </label>
    <div class="sheet-foot">
      <button value="cancel" class="ghost" data-i18n="btn.cancel"></button>
      <button value="send" class="primary" id="composeSend" data-i18n="btn.send"></button>
    </div>
  </form>
</dialog>

<dialog id="previewDialog" class="sheet wide">
  <form method="dialog" class="sheet-body">
    <h2 data-i18n="preview.title"></h2>
    <iframe id="previewFrame" title="Preview" sandbox=""></iframe>
    <div class="sheet-foot">
      <button value="close" class="primary" data-i18n="btn.close"></button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" hidden></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="./i18n.js"></script>
<script src="./analyzer.js"></script>
<script src="./store.js"></script>
<script src="./template.js"></script>
<script src="./gmail.js"></script>
<script src="./app.js"></script>
</body>
</html>
